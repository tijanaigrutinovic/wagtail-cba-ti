# Reference Nginx config for DigitalOcean Droplet (runbook section 5.8).
# Install: sudo ln -s /path/to/this/file /etc/nginx/sites-available/cbaeducation.com

server {
    listen 80;
    server_name cbaeducation.com www.cbaeducation.com;

    client_max_body_size 50M;

    location /static/ {
        alias /srv/cba-wagtail/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/cba-wagtail/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/run/cba-wagtail.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
