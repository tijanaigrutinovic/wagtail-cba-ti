<section class="cba-home__block cba-home__block--white cba-home__acceleration">
    {% if value.heading %}
        <h2 class="cba-home__section-heading cba-home__section-heading--acceleration">{{ value.heading }}</h2>
    {% endif %}
    <div class="cba-home__icons-row cba-home__icons-row--heroic">
        {% for item in value.items %}
            <div class="cba-home__icon-item">
                <svg class="cba-home__icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    {% if item.icon == "shield" %}
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    {% elif item.icon == "lightning" %}
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    {% elif item.icon == "clock" %}
                        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                    {% elif item.icon == "chart" %}
                        <path d="M3 17V5"/><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h7v7"/>
                    {% endif %}
                </svg>
                <h4>{{ item.label }}</h4>
            </div>
        {% endfor %}
    </div>
</section>
