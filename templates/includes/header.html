{% load static wagtailsettings_tags cba_tags %}
{% get_settings %}

<div class="cba-nav-wrap fixed-top">
    <nav class="navbar cba-navbar navbar-expand-lg navbar-dark">
        <div class="container cba-nav__inner">
            <a class="navbar-brand cba-nav__brand d-flex align-items-center" href="/">
                <img src="{% static 'cba/images/logo.svg' %}" alt="Center for Business Acceleration">
            </a>

            <div class="cba-nav__header-controls d-flex align-items-center ml-auto">
                <div class="custom-control custom-switch cba-nav__theme-switch d-flex align-items-center">
                    <input type="checkbox" class="custom-control-input" id="themeToggle" aria-label="Toggle dark mode">
                    <label class="custom-control-label mb-0" for="themeToggle">
                        <span class="cba-nav__theme-label">Dark mode</span>
                    </label>
                </div>

                <button class="navbar-toggler cba-nav__toggler d-lg-none" type="button" data-toggle="collapse" data-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse cba-nav__collapse" id="navbarNav">
                <div class="cba-nav__row d-flex flex-column flex-lg-row align-items-lg-center ml-lg-auto">
                    <ul class="navbar-nav cba-nav__main align-items-lg-center mb-0">
                        {% for item in settings.core.NavigationSettings.nav_links %}
                            <li class="nav-item">
                                <a class="nav-link" href="{% resolve_link_url item.value %}">{{ item.value.label }}</a>
                            </li>
                        {% endfor %}
                        <li class="nav-item">
                            <a class="nav-link cba-nav__enroll" href="{{ settings.core.NavigationSettings.cta_button_url }}">
                                {{ settings.core.NavigationSettings.cta_button_text }}
                            </a>
                        </li>
                    </ul>

                    <div class="cba-nav__actions d-flex flex-lg-row align-items-lg-center">
                        <a href="{{ settings.core.NavigationSettings.login_url }}" class="cba-nav__login">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>
