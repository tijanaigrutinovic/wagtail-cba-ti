<div class="form-group">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %} *{% endif %}
    </label>
    {{ field }}
    {% if field.errors %}
        <p class="field-error text-danger small mb-0">{{ field.errors|join:", " }}</p>
    {% endif %}
</div>
